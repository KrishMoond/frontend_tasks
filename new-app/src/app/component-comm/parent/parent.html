<div class="border border-blue-300 rounded-lg p-6 bg-blue-50 mb-4">
  <p class="text-sm font-semibold text-blue-600 uppercase mb-2">Parent Component</p>
  <p class="text-gray-700 mb-1">Sends <code class="bg-blue-100 px-1 rounded text-sm">counter</code> to child via <strong>@Input</strong></p>
  <p class="text-gray-700 mb-4">Receives updates from child via <strong>@Output EventEmitter</strong></p>
  <p class="text-lg font-bold">Counter value in Parent: <span class="text-blue-600">{{ counter }}</span></p>
</div>

<app-child [counter]="counter" (counterChange)="onCounterChange($event)" />
