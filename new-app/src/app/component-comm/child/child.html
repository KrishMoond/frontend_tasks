<div class="border border-green-300 rounded-lg p-6 bg-green-50">
  <p class="text-sm font-semibold text-green-600 uppercase mb-2">Child Component</p>
  <p class="text-gray-700 mb-4">Receives counter via <strong>@Input</strong>, emits changes back via <strong>@Output</strong></p>
  <p class="text-lg font-bold mb-4">Counter received: <span class="text-green-600">{{ counter }}</span></p>
  <div class="flex gap-3">
    <button (click)="decrement()"
      class="bg-red-500 hover:bg-red-600 text-white px-5 py-2 rounded font-medium">
      − Decrement
    </button>
    <button (click)="increment()"
      class="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded font-medium">
      + Increment
    </button>
  </div>
</div>
