<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="personalForm">
        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" minlength="3" maxlength="50" pattern="[A-Za-z\s]+" title="Name should only contain letters and spaces (min 3 characters)." required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" minlength="8" title="Password must be at least 8 characters long." required><br><br>

            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number." required><br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br><br>

            <label for="range">Range:</label>
            <input type="range" id="range" name="range" min="0" max="100"><br><br>

            <label for="file">Upload File:</label>
            <input type="file" id="file" name="file" accept=".pdf" required><br><br>

            <label for="github">GitHub URL:</label>
            <input type="url" id="github" name="github" required><br><br>

            <label for="gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female">Female</label><br><br>

            <label for="skills">Skills: </label>
            <input type="checkbox" id="skill1" name="skills" value="programming">
            <label for="skill1">Programming</label>
            <input type="checkbox" id="skill2" name="skills" value="design">
            <label for="skill2">Design</label>
            <input type="checkbox" id="skill3" name="skills" value="management">
            <label for="skill3">Management</label><br><br>

            <label for="country">Country:</label>
            <select id="country" name="country" required>
                <option value="">Select a country</option>
                <optgroup label="Europe">
                    <option value="germany">Germany</option>
                    <option value="france">France</option>
                </optgroup>
                <optgroup label="Asia">
                    <option value="india">India</option>
                    <option value="china">China</option>
                </optgroup>
            </select><br><br>

            <input type="submit" value="Submit">
        </fieldset>
    </form>

    <script>
        document.getElementById('personalForm').addEventListener('submit', function(e) {
            const skills = document.querySelectorAll('input[name="skills"]');
            const isSkillChecked = Array.from(skills).some(skill => skill.checked);
            
            if (!isSkillChecked) {
                e.preventDefault();
                alert("Please select at least one skill.");
            }
        });
    </script>
</body>
</html>
