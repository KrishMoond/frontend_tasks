<!DOCTYPE html>
<html>
<head>
    <title>Applicant Details</title>
</head>
<body>

    <h2>Applicant Details</h2>

    <form>

        First Name:
        <input type="text" name="firstname"><br><br>

        Last Name:
        <input type="text" name="lastname"><br><br>

        Email:
        <input type="email" name="email"><br><br>

        Gender:<br>
        Male <input type="radio" name="gender" value="male">
        Female <input type="radio" name="gender" value="female"><br><br>

        Contact:
        <input type="text" name="contact"><br><br>

        Qualification:
        <input type="file" name="qualification"><br><br>

        Joining Date:
        <input type="date" name="joiningdate"><br><br>

        Skills:<br>
        <input type="checkbox" name="skills" value="JavaScript"> JavaScript
        <input type="checkbox" name="skills" value="Java"> Java<br><br>

        <input type="checkbox" name="skills" value="React"> React
        <input type="checkbox" name="skills" value="Express"> Express<br><br>

        <input type="checkbox" name="skills" value="Python"> Python
        <input type="checkbox" name="skills" value="SQL"> SQL<br><br>

        Year of Experience:
        <input type="range" min="0" max="10"><br><br>

        Work Location:
        <select>
            <option>--Default--</option>
            <option>Delhi</option>
            <option>Mumbai</option>
            <option>Bangalore</option>
        </select><br><br>

        Address:<br>
        <textarea rows="4" cols="40"></textarea><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
