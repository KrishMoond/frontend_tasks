<h2 class="text-2xl font-bold mb-1">📝 CRUD with HttpClient</h2>
<p class="text-gray-500 text-sm mb-5">Using <strong>JSONPlaceholder API</strong> — changes are simulated (not persisted)</p>

<div *ngIf="message" class="bg-green-100 text-green-800 px-4 py-2 rounded mb-4 text-sm">{{ message }}</div>

<form (ngSubmit)="submit()" class="flex flex-col gap-3 mb-8 max-w-lg">
  <input
    [(ngModel)]="form.title" name="title" placeholder="Title" required
    class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
  />
  <textarea
    [(ngModel)]="form.body" name="body" placeholder="Body" required rows="3"
    class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 resize-none"
  ></textarea>
  <div class="flex gap-3">
    <button type="submit" class="bg-gray-900 text-white px-5 py-2 rounded text-sm hover:bg-gray-700">
      {{ editingId !== null ? 'Update' : 'Create' }}
    </button>
    <button *ngIf="editingId !== null" type="button" (click)="reset()"
      class="bg-gray-400 text-white px-5 py-2 rounded text-sm hover:bg-gray-500">
      Cancel
    </button>
  </div>
</form>

<div class="flex flex-col gap-3">
  <div *ngFor="let post of posts" class="flex justify-between items-start border border-gray-200 rounded-lg p-4 bg-white">
    <div class="flex-1 pr-4">
      <p class="font-semibold text-sm">#{{ post.id }} — {{ post.title }}</p>
      <p class="text-gray-500 text-sm mt-1">{{ post.body }}</p>
    </div>
    <div class="flex flex-col gap-2 min-w-16">
      <button (click)="edit(post)" class="bg-yellow-400 text-black px-3 py-1 rounded text-xs hover:bg-yellow-500">Edit</button>
      <button (click)="delete(post.id!)" class="bg-red-500 text-white px-3 py-1 rounded text-xs hover:bg-red-600">Delete</button>
    </div>
  </div>
</div>
